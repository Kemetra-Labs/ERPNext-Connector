# SonarCloud automatic analysis settings.
#
# The .sql files (the live-e2e fixtures under specs/) are Postgres SQL. The
# PL/SQL analyzer claims every .sql file and reports false findings on them.
# Automatic analysis cannot change the analyzer's file suffixes, so exclude the
# .sql files from analysis instead.
sonar.exclusions=**/*.sql

# RT-469 (owner decision B4, 2026-10-18; docs/decisions/sonar-test-style-rules.md, option c):
# ignore the two test-style rules for test code only. Production code, the org quality profile and
# the quality gate are untouched. Both are style-only in this repo: every conjunct of a composite
# assert is still checked, and no pytest.raises block can be satisfied by a nested builder.
#   python:S9073  composite assertion      python:S5778  several calls inside pytest.raises
# Whether SonarCloud automatic analysis honours these keys is NOT verified; the project-level
# "Ignore Issues on Multiple Criteria" setting (owner action, see the PR) is the authoritative path.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S9073
sonar.issue.ignore.multicriteria.e1.resourceKey=retail_tower_erpnext_connector/tests/**
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S5778
sonar.issue.ignore.multicriteria.e2.resourceKey=retail_tower_erpnext_connector/tests/**
