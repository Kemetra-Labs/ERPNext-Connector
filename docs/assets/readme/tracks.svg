<rect x="48.5" y="436.5" width="1183" height="75" rx="16" fill="none" stroke="url(#aurora)" stroke-width="2"/>
<rect x="72" y="456" width="52" height="36" rx="18" fill="url(#aurora)"/>
<text x="98" y="480" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">AI</text>
<text x="146" y="470" font-size="16" font-weight="700" fill="#fff">Embedded in all four tracks</text>
<text x="146" y="491" font-size="13" fill="#cbd5e1">same contracts  ·  same tenant scope  ·  same audit trail  ·  no side door</text>
<text x="1156" y="326" text-anchor="middle" font-size="11" fill="#94a3b8">no direct AI path:</text><text x="1156" y="341" text-anchor="middle" font-size="11" fill="#94a3b8">reached only via the Connector</text>
