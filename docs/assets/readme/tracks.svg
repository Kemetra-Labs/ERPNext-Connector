<text x="416" y="191" font-size="16" font-weight="700" fill="#fff">Backend-Core</text>
<text x="416" y="228" font-size="12.5" fill="#cbd5e1">the single contract boundary</text>
<text class="mono" x="416" y="378" font-size="11" fill="#a78bfa">NestJS · PostgreSQL · Redis</text>
