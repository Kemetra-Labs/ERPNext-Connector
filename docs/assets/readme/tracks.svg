<path d="M800 224V204a14 14 0 0 1 14 -14H986a14 14 0 0 1 14 14V224z" fill="url(#g-connector)"/>
<text x="816" y="213" font-size="16" font-weight="700" fill="#fff">ERPNext-Connector</text>
