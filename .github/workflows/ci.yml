# RT-381: run the frappe-free unit tests and lint on every PR and on main.
# tests/test_foundation.py imports frappe and runs only on a bench (staging-install runbook).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 3.11 matches the ERPNext/Frappe v15 bench runtime (rt9 image: Python 3.11.6).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: false
          # A fresh .venv on PATH for the later steps, so lint and tests see only the locked set.
          python-version: "3.11"
          activate-environment: true

      # RT-690 / RT-467: the CI tool set is declared in pyproject.toml [dependency-groups].ci and
      # locked, with sha256 hashes and wheels only, in pylock.toml. --require-hashes refuses any
      # wheel without a matching hash; --no-build refuses sdists (no setup scripts run). The venv starts
      # empty, so installing the locked set equals syncing to it.
      # RT-635: sentry-sdk is not an app dependency (Frappe v15/v16 ship sentry-sdk~=1.45.1); it is
      # in the ci group so the Connector Sentry client tests run against the real SDK, not only on a bench.
      # Refresh: bump a pin in [dependency-groups].ci, then re-run and commit both files in one PR:
      #   uv pip compile pyproject.toml --group ci --python-version 3.11 \
      #     --python-platform x86_64-manylinux_2_28 --only-binary :all: -o pylock.toml
      - name: Install test tools (hash-locked)
        run: uv pip install --require-hashes --no-build -r pylock.toml

      - name: Lint
        run: python -m ruff check retail_tower_erpnext_connector

      - name: Unit tests (frappe-free)
        run: >-
          python -m pytest -q retail_tower_erpnext_connector/tests
          --ignore=retail_tower_erpnext_connector/tests/test_foundation.py
          --cov=retail_tower_erpnext_connector --cov-report=xml:coverage.xml

      # RT-460: informational coverage upload. Never affects the CI verdict: the step is
      # continue-on-error and the check below only warns. Skipped for fork PRs (no secrets).
      - name: Check coverage report
        if: success()
        run: |
          if [ ! -s coverage.xml ]; then
            echo "::warning::coverage.xml is missing or empty; skipping Codecov upload is expected."
          fi

      - name: Upload coverage to Codecov
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        timeout-minutes: 3
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
