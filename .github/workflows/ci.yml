# RT-381: run the frappe-free unit tests and lint on every PR and on main.
# tests/test_foundation.py imports frappe and runs only on a bench (staging-install runbook).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 3.11 matches the ERPNext/Frappe v15 bench runtime (rt9 image: Python 3.11.6).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install test tools
        run: python -m pip install pytest==9.1.1 pytest-cov==7.1.0 ruff==0.15.20

      - name: Lint
        run: python -m ruff check retail_tower_erpnext_connector

      - name: Unit tests (frappe-free)
        run: >-
          python -m pytest -q retail_tower_erpnext_connector/tests
          --ignore=retail_tower_erpnext_connector/tests/test_foundation.py
          --cov=retail_tower_erpnext_connector --cov-report=xml:coverage.xml

      # RT-460: informational coverage upload. Never affects the CI verdict: the step is
      # continue-on-error and the check below only warns. Skipped for fork PRs (no secrets).
      - name: Check coverage report
        if: success()
        run: |
          if [ ! -s coverage.xml ]; then
            echo "::warning::coverage.xml is missing or empty; skipping Codecov upload is expected."
          fi

      - name: Upload coverage to Codecov
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
